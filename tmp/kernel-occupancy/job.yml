version: 1
profile: ../workflow/sweep-environment.yml
name: null
description: Compare and tune occupancy-aware tensor-parallel MoE
image_build:
  cwd: ../..
  argv: [python, tmp/serving-comparison/prepare_image.py]
  timeout_seconds: 28800
code:
  directory: ./payload
  delivery: snapshot
  destination: /workspace/kernel-occupancy
  include: [tune.py, session.py, worker.py, diagnostics.py, pipeline.py, profile_tools.py, control_kernel.py, plan.json, reporting.py, collector.py]
inputs: {}
run:
  cwd: /opt/tpu-inference
  argv: [python3, -u, /workspace/kernel-occupancy/tune.py, --plan, /workspace/kernel-occupancy/plan.json]
  env:
    PYTHONUNBUFFERED: "1"
    JAX_PLATFORMS: tpu
  verify_imports:
    vllm: /opt/vllm
    tpu_inference: /opt/tpu-inference
outputs:
  directory: ./results
  snapshot_seconds: 30
  delivery: incremental
  report: collector.py
execution:
  cleanup: after_collection
  timeout_seconds: 28800
  max_in_flight: 1
  wait_seconds: 86400
  archive_seconds: 1200
