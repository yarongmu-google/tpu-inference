              - name: CDK_PROFILE
                value: cloud-tpu-inference-test
              image: us-central1-docker.pkg.dev/cloud-tpu-inference-test/vllm-tpu-rdna/vllm-torchtpu-caojx_google_com:caojx-fix-rpa-static-constants-ebusy
