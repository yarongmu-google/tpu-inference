          spec:
            containers:
            - args:
              - "set -x\n\n# --------------------------------------------------------\n#
                Setup compiler & runtime cache directories on disk\n# --------------------------------------------------------\nmkdir
                -p \"${CACHE_DIR}\" \"${TMPDIR}\" \"${TRITON_CACHE_DIR}\" \"${VLLM_CACHE_ROOT}\"
                \\\n         \"${VLLM_CONFIG_ROOT}\" \"${VLLM_XLA_CACHE_PATH}\" \"${TORCH_TPU_CACHE_DIR}\"
                \\\n         \"${JAX_COMPILER_CACHE_DIR}\" \"${TPU_LOG_DIR}\" /dev/shm/xprof
                || exit 1\nif [ -n \"${TORCH_TPU_TIER3_COMPILATION_CACHE_ROOT:-}\"
                ]; then\n  mkdir -p \"${TORCH_TPU_TIER3_COMPILATION_CACHE_ROOT}\"
                || exit 1\nfi\nrm -f /tmp/libtpu* /dev/shm/libtpu* 2>/dev/null ||
                true\n\necho \"trace-start-event: name=vllm-server ts=$(date +'%s.%N')
                pid=vllm tid=vllm\"\n\n# --------------------------------------------------------\n#
                Dynamic LIBTPU_INIT_ARGS and MoE flags matching server.sh\n# --------------------------------------------------------\nDEFAULT_LIBTPU_INIT_ARGS=\"
                --xla_tpu_use_minor_sharding_for_major_trivial_input=true --xla_tpu_enable_sparse_core_collective_offload_reduce_scatter=false
                --xla_tpu_ars_combiner_threshold_in_bytes=0 --xla_tpu_enable_async_collective_merger=false\"\n\n#
                1. Use hierarchical all-reduce for large TP activations on TP8\nif
                [ \"8\" -gt 1 ] && [ \"${TPU_TP_HIERARCHICAL_ALL_REDUCE_MIN_TOKENS:-0}\"
                -gt 0 ]; then\n  TP_HIERARCHICAL_AR_MIN_BYTES=$(( TPU_TP_HIERARCHICAL_ALL_REDUCE_MIN_TOKENS
                * 4096 * 2 ))\n  DEFAULT_LIBTPU_INIT_ARGS+=\" --xla_tpu_enable_sparse_core_hierarchical_all_reduce=true
                --xla_tpu_sparse_core_all_reduce_offload_min_size_in_bytes=$TP_HIERARCHICAL_AR_MIN_BYTES\"\nfi\n\n#
                2. Allow fused row gather to overlap routing for DP8+EP\nif [ \"${USE_MOE_FUSED_EP_KERNEL:-0}\"
                = \"1\" ]; then\n  export TPU_MOE_FUSED_EP_STEP_MIN_TOKENS=\"${TPU_MOE_FUSED_EP_STEP_MIN_TOKENS:-33}\"\n
                \ export TPU_MOE_FUSED_EP_ASYNC_ROW_GATHER=\"${TPU_MOE_FUSED_EP_ASYNC_ROW_GATHER:-1}\"\nfi\n\nif
                [ \"${TPU_MOE_FUSED_EP_ASYNC_ROW_GATHER:-0}\" = \"1\" ]; then\n  DEFAULT_LIBTPU_INIT_ARGS+=\"
                --xla_enable_async_all_gather=true --xla_tpu_enable_sparse_core_collective_offload_all_gather=true
                --xla_tpu_sparse_core_all_gather_offload_min_size_in_bytes=262144\"\nfi\n\n#
                Set final LIBTPU_INIT_ARGS unless explicitly overridden via recipe
                variable\nexport LIBTPU_INIT_ARGS=\"$DEFAULT_LIBTPU_INIT_ARGS\"\n\n#
                Start vLLM server\nGPU_MEMORY_UTIL=\"0.92\"\nDP_SIZE=1\nMAX_BATCHED_TOKENS=\"16384\"\nATTN_BACKEND=\"CUSTOM\"\n\necho
                \"trace-start-event: name=copy-ckpt ts=$(date +'%s.%N') pid=vllm tid=vllm\"\ngcloud
                storage rsync -r gs://cloud-devkit/ckpt/hf/$MODEL_NAME /root/.cache/huggingface/$MODEL_NAME
                || exit 1\necho \"trace-end-event: name=copy-ckpt ts=$(date +'%s.%N')
                pid=vllm tid=vllm\"\n\n# NUMA policy: enable MPOL_PREFERRED to prevent
                Node 0 OOM kills\nexport RAIDEN_NUMA_POLICY=\"preferred\"\n\n# Evict
                host page cache for checkpoint weight files after loading to prevent
                OOM kills\nexport TPU_EVICT_WEIGHTS_PAGE_CACHE=\"true\"\n\nvllm serve
                \\\n  /root/.cache/huggingface/$MODEL_NAME \\\n  --served-model-name=\"$MODEL_NAME\"
                \\\n  --tensor-parallel-size=8 \\\n  --data-parallel-size=1 \\\n  --max-model-len=262144
                \\\n  --quantization=fp8 \\\n  --max-num-batched-tokens=${MAX_BATCHED_TOKENS}
                \\\n  --max-num-seqs=40 \\\n  --host 0.0.0.0 \\\n  --port 8000 \\\n
                \ --async-scheduling \\\n  --prefill-schedule-interval=1 \\\n  --enable-prefix-caching
                \\\n  --gpu-memory-utilization=${GPU_MEMORY_UTIL} \\\n  --kv-cache-dtype=fp8
                \\\n  --language-model-only \\\n  --enable-expert-parallel \\\n  --attention-backend
                ${ATTN_BACKEND} \\\n  --block-size 256 \\\n  --limit-mm-per-prompt
                '{\"image\":0,\"video\":0}' \\\n  --default-chat-template-kwargs '{\"enable_thinking\":false}'
                \\\n  --tool-call-parser=qwen3_coder \\\n  --reasoning-parser=qwen3
                \\\n  --mamba-cache-mode align \\\n  --trust-remote-code \\\n  --enable-prompt-tokens-details
                \\\n  --kv-cache-memory-bytes 41875931136 \\\n  --kv-transfer-config
                '{\"kv_connector\":\"TPURaidenOffloadingConnector\",\"kv_connector_module_path\":\"vllm_torchtpu.offload.raiden_connector\",\"kv_role\":\"kv_both\",\"kv_connector_extra_config\":{\"cpu_bytes_to_use\":644245094400
                }}' \\\n  \n\nVLLM_EXIT_CODE=$?\n\necho \"trace-end-event: name=vllm-server
                ts=$(date +'%s.%N') pid=vllm tid=vllm\"\n\nexit ${VLLM_EXIT_CODE}\n"
