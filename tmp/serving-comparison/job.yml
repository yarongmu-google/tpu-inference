version: 1
profile: ../workflow/sweep-environment.yml
name: null
description: Measure the original EP baseline at 1k input and 8k output
image_build:
  cwd: ../..
  argv: [python, tmp/serving-comparison/prepare_image.py]
  timeout_seconds: 28800
code:
  directory: ./payload
  delivery: snapshot
  destination: /workspace/experiment
  include: [compare.py, preflight.py, plan.json]
inputs:
  server_commands:
    source: ../../scripts/vllm/benchmarking
    destination: /workspace/server-commands
run:
  cwd: /opt/tpu-inference
  argv: [python3, -u, /workspace/experiment/compare.py]
  env:
    PYTHONUNBUFFERED: "1"
    COMPARISON_PLAN: /workspace/experiment/plan.json
    HF_HOME: /run-scratch/huggingface
    HF_HUB_CACHE: /run-scratch/huggingface/hub
    HF_XET_CACHE: /run-scratch/huggingface/xet
    HF_XET_CHUNK_CACHE_SIZE_BYTES: "0"
  verify_imports:
    vllm: /opt/vllm
    tpu_inference: /opt/tpu-inference
outputs:
  directory: ./results
  snapshot_seconds: 30
execution:
  cleanup: after_collection
  timeout_seconds: 28800
  scratch_gib: 600  # Volume size ceiling, not a scheduler disk reservation.
  max_in_flight: 1
  wait_seconds: 86400
  archive_seconds: 1200
