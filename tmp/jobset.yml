apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: v7-8-meta
spec:
  replicatedJobs:
    - name: tpu-worker
      replicas: 1  # 1 hosts * 8 chips = 8 chips
      template:
        spec:
          parallelism: 1
          completions: 1
          template:
            spec:
              nodeSelector:
                cloud.google.com/gke-tpu-topology: 2x2x2 # Adjust to your cluster's specific v7-8 topology string
              containers:
                - name: runner
                  image: {{ .IMAGE | default "ubuntu:24.04" }}
                  command: ["/bin/bash", "-c"]
                  args:
                    - |
		      # 1. Setup the GCS persistent directory 
                      mkdir -p $CDK_OUTPUT_DIR
                      cd /workspace
                      
                      # Auto-install dependencies if a requirements file is mapped
                      if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
                      
                      # Run the dynamically provided script
                      bash {{ .SCRIPT | default "tmp/sweep.sh" }} > $CDK_OUTPUT_DIR/job_logs.txt 2>&1

		      # 3. Rescue the hardcoded outputs to GCS before the pod dies
                      echo "Copying hardcoded logs to persistent storage..."
                      cp -r /tmp/some_dir/*.log $CDK_OUTPUT_DIR/ 2>/dev/null || true
                      cp -r /tmp/*s2weep*.log $CDK_OUTPUT_DIR/ 2>/dev/null || true
              restartPolicy: Never
