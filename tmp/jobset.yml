apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: v7-8-meta
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
    - name: tpu-worker
      replicas: 1
      template:
        spec:
          backoffLimit: 0
          parallelism: 1
          completions: 1
          template:
            spec:
              nodeSelector:
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 2x2x1
              terminationGracePeriodSeconds: 120
              containers:
                - name: runner
                  image: {{ .IMAGE }}
                  workingDir: /opt/tpu-inference
                  command: ["python3", "/opt/tpu-inference/tmp/jobset_runner.py"]
                  env:
                    - name: RUN_IMAGE
                      value: "{{ .IMAGE }}"
                    - name: SWEEP_SCRIPT
                      value: "{{ .SCRIPT | default "tests/e2e/benchmarking/inferencex/qwen3.5/sweep.sh" }}"
                    - name: RESUME_DIR
                      value: "{{ .RESUME_DIR | default "" }}"
                    - name: INFERENCEX_REPO
                      value: /opt/InferenceX
                  resources:
                    requests:
                      google.com/tpu: 4
                    limits:
                      google.com/tpu: 4
                  volumeMounts:
                    - name: shared-memory
                      mountPath: /dev/shm
              volumes:
                - name: shared-memory
                  emptyDir:
                    medium: Memory
              restartPolicy: Never
